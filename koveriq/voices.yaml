# Piper voices the KoverIQ worker may use (spec §10.2). A voice that is not
# listed under `voices` cannot be selected.
#
# A voice is listed only if BOTH its training data AND its training lineage
# allow commercial use of the generated audio. Many en_GB Piper voices are
# fine-tuned from en_US-lessac (Blizzard 2013 data, research-only licence) or
# en_US-ryan (CC BY-NC-SA); those are rejected even when their own dataset is
# CC BY. Evidence and open questions: docs/koveriq-licences.md.
#
# Checked 2026-10-23 against rhasspy/piper-voices at the revision below; file
# hashes were verified by downloading the files.
